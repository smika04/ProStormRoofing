<form class="form" id="estimateForm" data-form-type="estimate">
    <label>
        <span>Your name</span>
        <input type="text" name="name" placeholder="John Smith" autocomplete="name" required>
    </label>

    <fieldset class="form__choice-group">
        <legend>Preferred contact method</legend>

        <div class="form__choices">
            <label class="form__choice">
                <input type="radio" name="contact_method" value="phone" required>
                <span>Phone</span>
            </label>

            <label class="form__choice">
                <input type="radio" name="contact_method" value="email" required>
                <span>Email</span>
            </label>

            <label class="form__choice">
                <input type="radio" name="contact_method" value="both" required>
                <span>Phone & Email</span>
            </label>
        </div>
    </fieldset>

    <div class="form__conditional-field" data-contact-field="phone">
        <label>
            <span>Phone number</span>
            <input type="tel" name="phone" placeholder="(604) 000-0000" autocomplete="tel">
        </label>
    </div>

    <div class="form__conditional-field" data-contact-field="email">
        <label>
            <span>Email address</span>
            <input type="email" name="email" placeholder="john@example.com" autocomplete="email">
        </label>
    </div>

    <div class="form__callback">
        <fieldset class="form__choice-group">
            <legend>Preferred days to call</legend>

            <div class="form__choices">
                <label class="form__choice">
                    <input type="checkbox" name="callback_days[]" value="monday">
                    <span>Mon</span>
                </label>

                <label class="form__choice">
                    <input type="checkbox" name="callback_days[]" value="tuesday">
                    <span>Tue</span>
                </label>

                <label class="form__choice">
                    <input type="checkbox" name="callback_days[]" value="wednesday">
                    <span>Wed</span>
                </label>

                <label class="form__choice">
                    <input type="checkbox" name="callback_days[]" value="thursday">
                    <span>Thu</span>
                </label>

                <label class="form__choice">
                    <input type="checkbox" name="callback_days[]" value="friday">
                    <span>Fri</span>
                </label>

                <label class="form__choice">
                    <input type="checkbox" name="callback_days[]" value="saturday">
                    <span>Sat</span>
                </label>

                <label class="form__choice">
                    <input type="checkbox" name="callback_days[]" value="sunday">
                    <span>Sun</span>
                </label>
            </div>
        </fieldset>

        <fieldset class="form__choice-group">
            <legend>Preferred time to call</legend>

            <div class="form__choices">
                <label class="form__choice">
                    <input type="radio" name="callback_time" value="morning">
                    <span>Morning</span>
                </label>

                <label class="form__choice">
                    <input type="radio" name="callback_time" value="afternoon">
                    <span>Afternoon</span>
                </label>

                <label class="form__choice">
                    <input type="radio" name="callback_time" value="evening">
                    <span>Evening</span>
                </label>
            </div>
        </fieldset>
    </div>

    <div class="service-field">
        <span>How can we help?</span>

        <div class="service-dropdown" data-service-dropdown>
            <button class="service-dropdown__button" type="button" aria-expanded="false">
                <span data-service-dropdown-text>Select a service</span>
            </button>

            <div class="service-dropdown__options">
                <button type="button" data-value="roof-replacement">Roof replacement</button>
                <button type="button" data-value="roof-repair">Roof repair</button>
                <button type="button" data-value="inspection-maintenance">Inspection & maintenance</button>
                <button type="button" data-value="custom">Custom</button>
            </div>

            <input type="hidden" name="service" data-service-dropdown-input required>
        </div>
    </div>

    <label class="form__textarea-field">
        <span>Project details</span>
        <textarea name="message" placeholder="Tell us more about your roof or project" rows="4"></textarea>
    </label>

    <div class="form__photos" data-photo-uploader>
        <span class="form__photos-title">Attach a photo to help us provide more accurate feedback.</span>

        <div class="form__photos-list" data-photo-list></div>

        <label class="form__photo-add" data-photo-add>
            <input type="file" name="photos[]" accept="image/*" data-photo-input>
            <span>Upload photo</span>
        </label>

        <p class="form__photos-note">You can add up to 3 photos.</p>
    </div>

    <button class="btn form__submit" type="submit">Request my free estimate</button>
    <input type="hidden" name="form_type" value="estimate">
    <p class="form__message" id="formMessage" hidden>
        Thank you! Your request has been received.
    </p>

    <div class="cf-turnstile"></div>
</form>
